# Reusable scan for every modootoday repository: the dependency audit and the secrets gate,
# both against the caller's baselines, then spec check. The caller supplies its catalog and
# baselines; the scanner is the private @modootoday/devtools-security-audit.
name: repository-scan
on:
  workflow_call:
    inputs:
      scanner:
        description: "npm installs the scanner from the registry (needs npm-read-token); workspace builds it from the caller's own tree."
        type: string
        default: npm
      scanner-version:
        description: Exact scanner version for scanner npm.
        type: string
        default: "0.3.0"
      scanner-path:
        description: The scanner package directory in the caller's tree, for scanner workspace.
        type: string
        default: ""
      scanner-build:
        description: Command that builds the scanner in the caller's tree, for scanner workspace.
        type: string
        default: ""
      catalog:
        description: The caller's unit catalog module.
        type: string
        default: .security-audit/catalog.mjs
      audit-floor:
        description: Lowest severity of a new advisory that fails the dependency audit.
        type: string
        default: critical
      bun-version:
        type: string
        default: "1.3.14"
      node-version:
        type: string
        default: "22.18.0"
      spec:
        description: Run spec check through the specfold action.
        type: boolean
        default: true
      specfold-version:
        type: string
        default: v0.11.0
    secrets:
      npm-read-token:
        description: Read-only token for the private scanner package; needed only for scanner npm.
        required: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}
      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Scanner from the registry
        if: inputs.scanner == 'npm'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-read-token }}
          SCANNER_VERSION: ${{ inputs.scanner-version }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::scanner npm needs the npm-read-token secret"
            exit 1
          fi
          dir="$RUNNER_TEMP/scanner"
          mkdir -p "$dir"
          printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$dir/.npmrc"
          npm install --prefix "$dir" --userconfig "$dir/.npmrc" --ignore-scripts --no-audit --no-fund \
            "@modootoday/devtools-security-audit@$SCANNER_VERSION"
          rm -f "$dir/.npmrc"
          echo "SCANNER=$dir/node_modules/@modootoday/devtools-security-audit" >> "$GITHUB_ENV"
      - name: Scanner from the caller's tree
        if: inputs.scanner == 'workspace'
        env:
          SCANNER_PATH: ${{ inputs.scanner-path }}
          SCANNER_BUILD: ${{ inputs.scanner-build }}
        run: |
          if [ -z "$SCANNER_PATH" ] || [ -z "$SCANNER_BUILD" ]; then
            echo "::error::scanner workspace needs scanner-path and scanner-build"
            exit 1
          fi
          sh -c "$SCANNER_BUILD"
          echo "SCANNER=$GITHUB_WORKSPACE/$SCANNER_PATH" >> "$GITHUB_ENV"
      - name: Dependency audit
        id: deps
        env:
          AUDIT_FLOOR: ${{ inputs.audit-floor }}
        run: node "$SCANNER/dist/cli/audit-dependencies.js" --root . --floor "$AUDIT_FLOOR"
      - name: Secrets gate
        if: always() && steps.deps.outcome != 'skipped'
        env:
          CATALOG: ${{ inputs.catalog }}
        run: |
          # The scan exits non-zero on findings the gate drops (untracked files), so the gate
          # is told when this run started and refuses any output older than that.
          since=$(date -u '+%Y-%m-%dT%H:%M:%S.000Z')
          node "$SCANNER/dist/cli/run-all.js" --root . --catalog "$CATALOG" --scanner scan-secrets > /dev/null || true
          node "$SCANNER/dist/cli/gate-secrets.js" --root . --since="$since"

  spec:
    if: inputs.spec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: modootoday/specfold@9321ce1e4317b365e742b57ed30084551fbde943 # v0.11.0
        with:
          version: ${{ inputs.specfold-version }}
