<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="터미널 사용 예 (modootoday — 개발자 도구). $ npx @modootoday/envs init — # 프로젝트의 .env 값을 암호화된 카탈로그로. $ spec check — # 프로젝트 문서를 규칙에 맞춰 검사합니다"><title>터미널 사용 예 (modootoday — 개발자 도구). $ npx @modootoday/envs init — # 프로젝트의 .env 값을 암호화된 카탈로그로. $ spec check — # 프로젝트 문서를 규칙에 맞춰 검사합니다</title><style>text{font-family:Pretendard,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',-apple-system,'Segoe UI',sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'D2Coding',monospace} @keyframes bl{50%{opacity:0}} .cu{animation:bl 1s step-end infinite} @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="1200" height="250" rx="16" fill="#0D1117" stroke="#3D444D"/><circle cx="28" cy="26" r="6" fill="#ff5f57"/><circle cx="48" cy="26" r="6" fill="#febc2e"/><circle cx="68" cy="26" r="6" fill="#28c840"/><text x="600" y="31" text-anchor="middle" font-size="13" fill="#7D8590">modootoday — 개발자 도구</text><clipPath id="l0"><rect x="36" y="64" height="34" width="0"><animate attributeName="width" values="900;0;0;900;900" keyTimes="0;.02;0.02;0.16;1" dur="10s" repeatCount="indefinite"/></rect></clipPath><text class="m" x="40" y="88" font-size="19" fill="#E6EDF3" clip-path="url(#l0)">$ npx @modootoday/envs init</text><clipPath id="l1"><rect x="36" y="106" height="34" width="0"><animate attributeName="width" values="900;0;0;900;900" keyTimes="0;.02;0.18;0.32;1" dur="10s" repeatCount="indefinite"/></rect></clipPath><text class="m" x="40" y="130" font-size="19" fill="#7D8590" clip-path="url(#l1)"># 프로젝트의 .env 값을 암호화된 카탈로그로</text><clipPath id="l2"><rect x="36" y="148" height="34" width="0"><animate attributeName="width" values="900;0;0;900;900" keyTimes="0;.02;0.34;0.48;1" dur="10s" repeatCount="indefinite"/></rect></clipPath><text class="m" x="40" y="172" font-size="19" fill="#E6EDF3" clip-path="url(#l2)">$ spec check</text><clipPath id="l3"><rect x=