<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="모두의오늘 · 운영 흐름 다이어그램. 1단계 브랜드 브레인: 브랜드 정보를 축적. 2단계 통합 스튜디오: 글과 영상을 기획·제작. 3단계 발행: 채널에 내보내기. 4단계 성과: 다음 콘텐츠에 반영. 발행 성과를 다음 콘텐츠에 반영하는 운영 흐름으로 다시 1단계에 이어집니다"><title>모두의오늘 · 운영 흐름 다이어그램. 1단계 브랜드 브레인: 브랜드 정보를 축적. 2단계 통합 스튜디오: 글과 영상을 기획·제작. 3단계 발행: 채널에 내보내기. 4단계 성과: 다음 콘텐츠에 반영. 발행 성과를 다음 콘텐츠에 반영하는 운영 흐름으로 다시 1단계에 이어집니다</title><style>text{font-family:Pretendard,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',-apple-system,'Segoe UI',sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'D2Coding',monospace}  @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="1199" height="279" rx="20" fill="#161B22" stroke="#3D444D"/><path d="M250 120H350" stroke="#3D444D" stroke-width="2"/><path d="M250 120H350" stroke="#F07450" stroke-width="2" stroke-dasharray="4 10"><animate attributeName="stroke-dashoffset" values="0;-28" dur="1s" repeatCount="indefinite"/></path><path d="M342 114l8 6-8 6" fill="none" stroke="#F07450" stroke-width="2"/><path d="M550 120H650" stroke="#3D444D" stroke-width="2"/><path d="M550 120H650" stroke="#F07450" stroke-width="2" stroke-dasharray="4 10"><animate attributeName="stroke-dashoffset" values="0;-28" dur="1s" repeatCount="indefinite"/></path><path d="M642 114l8 6-8 6" fill="none" stroke="#F07450" stroke-width="2"/><path d="M850 120H950" stroke="#3D444D" stroke-width="2"/><path d="M850 120H950" stroke="#F07450" stroke-width="2" stroke-dasharray="4 10"><animate attributeName="stroke-dashoffset" values="0;-28" dur="1s" repeatCount="indefinite"/></path><path d="M942 114l8 6-8 6" fill="none" stroke="#F07450" stroke-width="2"/><path d="M1050 165 C1050 250 150 250 150 165" fill="none" stroke="#3D444D" stroke-width="2" stroke-dasharray="3 7"/><circle r="5" fill="#F07450"><animateMotion dur="5s" repeatCount="indefinite" path="M1050 165 C1050 250 150 250 150 165"/></circle><text x="600" y="262" text-anchor="middle" font-size="14" fill="#AAB3BD">발행 성과를 다음 콘텐츠에 반영하는 운영 흐름</text><rect x="50" y="75" width="200" height="90" rx="16" fill="#0D1117" stroke="#F07450" stroke-width="2"><animate attributeName="stroke" values="#3D444D;#F07450;#3D444D" dur="4s" begin="0s" repeatCount="indefinite"/></rect><text x="150" y="113" text-anchor="middle" font-size="19" font-weight="800" fill="#F0F3F6">브랜드 브레인</text><text x="150" y="140" text-anchor="middle" font-size="14" fill="#AAB3BD">브랜드 정보를 축적</text><rect x="350" y="75" width="200" height="90" rx="16" fill="#0D1117" stroke="#3D444D" stroke-width="1"><animate attributeName="stroke" values="#3D444D;#F07450;#3D444D" dur="4s" begin="1s" repeatCount="indefinite"/></rect><text x="450" y="113" text-anchor="middle" font-size="19" font-weight="800" fill="#F0F3F6">통합 스튜디오</text><text x="450" y="140" text-anchor="middle" font-size="14" fill="#AAB3BD">글과 영상을 기획·제작</text><rect x="650" y="75" width="200" height="90" rx="16" fill="#0D1117" stroke="#3D444D" stroke-width="1"><animate attributeName="stroke" values="#3D444D;#F07450;#3D444D" dur="4s" begin="2s" repeatCount="indefinite"/></rect><text x="750" y="113" text-anchor="middle" font-size="19" font-weight="800" fill="#F0F3F6">발행</text><text x="750" y="140" text-anchor="middle" font-size="14" fill="#AAB3BD">채널에 내보내기</text><rect x="950" y="75" width="200" height="90" rx="16" fill="#0D1117" stroke="#3D444D" stroke-width="1"><animate attributeName="stroke" values="#3D444D;#F07450;#3D444D" dur="4s" begin="3s" repeatCount="indefinite"/></rect><text x="1050" y="113" text-anchor="middle" font-size="19" font-weight="800" fill="#F0F3F6">성과</text><text x="1050" y="140" text-anchor="middle" font-size="14" fill="#AAB3BD">다음 콘텐츠에 반영</text><text x="40" y="44" font-size="14" font-weight="700" fill="#F07450" letter-spacing="1">모두의오늘 · 운영 흐름</text></svg>